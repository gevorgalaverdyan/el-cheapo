[project]
name = "elcheapo"
version = "0.1.0"
description = "Conversational expense tracker driven through chat, backed by Google Sheets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-adk>=1.0",
    "google-genai>=1.0",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "tzdata>=2024.2",  # Windows ships no IANA tz database
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "time-machine>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elcheapo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
markers = [
    "live: tests that call real external APIs; deselected by default",
]
